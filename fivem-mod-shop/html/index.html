<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Mod商店</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 用户商店界面 -->
        <div class="shop-container" id="shopContainer">
            <div class="shop-header">
                <div class="shop-title">
                    <span class="shop-icon">🎮</span>
                    <h1>Mod商店</h1>
                </div>
                <div class="player-info">
                    <div class="player-name" id="playerName">玩家</div>
                    <div class="player-coins">
                        <span class="coin-icon">💰</span>
                        <span id="playerCoins">0</span>
                    </div>
                </div>
                <button class="close-btn" id="closeBtn">✕</button>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="shop">
                    <span>🛒</span> 商城
                </button>
                <button class="tab" data-tab="inventory">
                    <span>📦</span> 我的仓库
                </button>
            </div>

            <div class="tab-content" id="shopTab">
                <div class="mods-grid" id="modsGrid"></div>
            </div>

            <div class="tab-content" id="inventoryTab" style="display: none;">
                <div class="equipped-mod" id="equippedMod">
                    <h3>⚡ 当前装备</h3>
                    <p class="no-equipment">暂无装备</p>
                </div>
                <div class="mods-grid" id="inventoryGrid"></div>
            </div>

            <div class="notification" id="notification" style="display: none;">
                <span id="notificationText"></span>
            </div>
        </div>

        <!-- 管理员界面 -->
        <div class="admin-container" id="adminContainer" style="display: none;">
            <div class="shop-header">
                <div class="shop-title">
                    <span class="shop-icon">⚙️</span>
                    <h1>Mod商店管理</h1>
                </div>
                <button class="close-btn" id="closeAdminBtn">✕</button>
            </div>

            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="mods">
                    <span>🎮</span> Mod管理
                </button>
                <button class="admin-tab" data-tab="players">
                    <span>👥</span> 玩家管理
                </button>
            </div>

            <!-- Mod管理标签 -->
            <div class="tab-content" id="adminModsTab">
                <div class="add-mod-section">
                    <h2>➕ 添加新Mod</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Mod名称 *</label>
                            <input type="text" id="modName" placeholder="输入Mod名称">
                        </div>
                        <div class="form-group">
                            <label>价格 *</label>
                            <input type="number" id="modPrice" placeholder="输入价格">
                        </div>
                        <div class="form-group">
                            <label>模型名称/哈希 *</label>
                            <input type="text" id="modModel" placeholder="例如: mp_m_freemode_01">
                        </div>
                        <div class="form-group">
                            <label>分类</label>
                            <select id="modCategory">
                                <option value="other">其他</option>
                                <option value="cyberpunk">赛博朋克</option>
                                <option value="medieval">中世纪</option>
                                <option value="military">军事</option>
                                <option value="casual">休闲</option>
                                <option value="hero">英雄</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>图片URL</label>
                            <input type="text" id="modImage" placeholder="输入图片链接 (可选)">
                        </div>
                        <div class="form-group full-width">
                            <label>描述</label>
                            <textarea id="modDescription" placeholder="输入Mod描述 (可选)"></textarea>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="addModBtn">添加Mod</button>
                </div>

                <div class="mod-list-section">
                    <h2>📋 现有Mod列表</h2>
                    <div class="mods-grid" id="adminModsGrid"></div>
                </div>
            </div>

            <!-- 玩家管理标签 -->
            <div class="tab-content" id="adminPlayersTab" style="display: none;">
                <h2>👥 在线玩家列表</h2>
                <div class="players-grid" id="playersGrid"></div>
            </div>

            <div class="notification" id="adminNotification" style="display: none;">
                <span id="adminNotificationText"></span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
